name: Compilar MatchBoard v3.3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar Gradle
        run: gradle --version

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchBoard-v3-3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error