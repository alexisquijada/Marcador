name: Compilar FitPro BLE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de diagnostico
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: fitpro-ble-musica-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
