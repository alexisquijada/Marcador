plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.padel.fitprodiag'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.padel.fitprodiag'
        minSdk 23
        targetSdk 29
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
